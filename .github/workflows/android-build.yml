name: FORSAKEN 2D - Android Native APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
android-build:
name: Build FORSAKEN 2D Native APK
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Node.js 24
    uses: actions/setup-node@v4
    with:
      node-version: '24'

  - name: Set up Java JDK 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Verify build tools
    run: |
      node --version
      java -version
      gradle --version

  - name: Build native Android APK
    working-directory: android-native
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FORSAKEN-2D-v0.7.0-Android-APK
      path: android-native/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
